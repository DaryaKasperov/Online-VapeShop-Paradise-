{% extends 'dashboard/base.html' %}

{% block title %}Удалить вкус - Админ-панель{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Удалить вкус</h1>
    <a href="{% url 'dashboard:flavors' %}" class="btn btn-outline-light">
        <i class="fas fa-arrow-left"></i> Назад
    </a>
</div>

<div class="stat-card">
    <h4 class="text-danger">Вы уверены, что хотите удалить вкус?</h4>
    <p><strong>{{ flavor.name }}</strong></p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
            <i class="fas fa-trash"></i> Да, удалить
        </button>
        <a href="{% url 'dashboard:flavors' %}" class="btn btn-outline-light">
            Отмена
        </a>
    </form>
</div>
{% endblock %}
