{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Админ-панель Paradise{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #161616;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #666666;
            --border-color: #2a2a2a;
            --glow-blue: #4fc3f7;
            --glow-blue-dark: #0288d1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding-top: 70px;
        }

        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
            padding: 20px 0;
            position: fixed;
            top: 70px;
            left: 0;
            width: 250px;
            z-index: 100;
        }

        .sidebar .nav-link {
            color: var(--text-secondary);
            padding: 12px 24px;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .sidebar .nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar .nav-link.active {
            color: var(--glow-blue);
            border-left-color: var(--glow-blue);
            background: rgba(79, 195, 247, 0.1);
        }

        .sidebar .nav-link i {
            margin-right: 12px;
            width: 20px;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--glow-blue);
            transform: translateY(-4px);
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--glow-blue);
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.92) !important;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
        }

        .navbar-brand {
            font-weight: 700;
            color: #ffffff !important;
            letter-spacing: 0.1em;
        }

        .navbar-brand i {
            color: var(--glow-blue);
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            border: none;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(79, 195, 247, 0.2);
        }

        .btn-danger {
            background: #ff4444;
            border: none;
        }

        .btn-outline-light {
            border-color: var(--border-color);
            color: var(--text-secondary);
        }

        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .table {
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .table thead th {
            border-bottom: 2px solid var(--border-color);
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        .table tbody td {
            border-color: var(--border-color);
            vertical-align: middle;
        }

        .table-hover tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .form-control, .form-select {
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--glow-blue);
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.1);
            background: rgba(10, 10, 10, 0.8);
            color: var(--text-primary);
        }

        .form-label {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .alert {
            border: none;
            border-radius: 0;
        }

        .alert-success {
            background: rgba(79, 195, 247, 0.15);
            color: var(--glow-blue);
            border-left: 3px solid var(--glow-blue);
        }

        .alert-danger {
            background: rgba(255, 68, 68, 0.15);
            color: #ff4444;
            border-left: 3px solid #ff4444;
        }

        .img-thumbnail {
            background: var(--bg-secondary);
            border-color: var(--border-color);
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .main-content {
                margin-left: 0;
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Навигация -->



    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'dashboard:index' %}">
                <i class="fas fa-crown"></i>Paradise Admin
            </a>
            <div class="ms-auto">
                <a href="{% url 'catalog:product_list' %}" class="btn btn-outline-light btn-sm me-2">
                    <i class="fas fa-store"></i> На сайт
                </a>
                <!-- Выход -->
<a href="{% url 'dashboard:logout' %}" class="btn btn-outline-light btn-sm">
    <i class="fas fa-sign-out-alt"></i> Выйти
</a>
            </div>
        </div>
    </nav>

    <!-- Боковое меню -->
    <div class="sidebar">
        <div class="nav flex-column">
            <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
               href="{% url 'dashboard:index' %}">
                <i class="fas fa-home"></i>Главная
            </a>
            <a class="nav-link {% if 'product' in request.resolver_match.url_name %}active{% endif %}"
               href="{% url 'dashboard:products' %}">
                <i class="fas fa-box"></i>Товары
            </a>

            <div class="sidebar">
    <div class="nav flex-column">
        <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
           href="{% url 'dashboard:index' %}">
            <i class="fas fa-home"></i>Главная
        </a>
        <a class="nav-link {% if 'product' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'dashboard:products' %}">
            <i class="fas fa-box"></i>Товары
        </a>
        <a class="nav-link {% if 'category' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'dashboard:categories' %}">
            <i class="fas fa-tags"></i>Категории
        </a>
        <a class="nav-link {% if 'order' in request.resolver_match.url_name %}active{% endif %}"
           href="{% url 'dashboard:orders' %}">
            <i class="fas fa-shopping-cart"></i>Заказы
        </a>
        <a class="nav-link {% if 'blocked' in request.resolver_match.url_name %}active{% endif %}"
   href="{% url 'dashboard:blocked_users' %}">
    <i class="fas fa-ban"></i> Блокировка
</a>
    </div>
</div>

            <a class="nav-link {% if 'order' in request.resolver_match.url_name %}active{% endif %}"
               href="{% url 'dashboard:orders' %}">
                <i class="fas fa-shopping-cart"></i>Заказы
            </a>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="main-content">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
