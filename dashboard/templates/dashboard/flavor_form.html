{% extends 'dashboard/base.html' %}

{% block title %}{{ title }} - Админ-панель{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>{{ title }}</h1>
    <a href="{% url 'dashboard:flavors' %}" class="btn btn-outline-light">
        <i class="fas fa-arrow-left"></i> Назад
    </a>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="stat-card">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Название вкуса</label>
                    {{ form.name }}
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Доплата</label>
                    {{ form.price_extra }}
                </div>
                
                <div class="mb-3 form-check">
                    {{ form.is_active }}
                    <label class="form-check-label">Активен</label>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Сохранить
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
